[workspace]
members = [
    "crates/lab-core",
    "crates/lab-server",
    "crates/lab-console",
    "crates/lab-cli",
]
resolver = "2"

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
brotli = "8.0"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
futures-util = "0.3"
flate2 = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
