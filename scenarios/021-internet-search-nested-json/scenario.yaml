id: 021-internet-search-nested-json
name: Internet Search nested JSON
description: Nested JSON internet-search response is parsed without external access.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [search]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 21
endpoints:
  - id: internet-search
    source_kind: internet_search
    match: { method: GET, path: /v12/internet/nested, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: payload.results, candidate_field: hostname, record_id_field: rid }
    replies: [{ status: 200, body_file: fixtures/data.json }]
