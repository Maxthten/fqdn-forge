id: 043-retry-after-seconds
name: Retry-After seconds
description: A retryable 429 uses virtual rather than wall-clock waiting.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [generic]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 43
endpoints:
  - id: retry-seconds
    source_kind: generic_json
    allow_retry: true
    match: { method: GET, path: /v12/retry/seconds, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies:
      - { status: 429, retry_after: '2', body_file: fixtures/error.json }
      - { status: 200, body_file: fixtures/data.json }
