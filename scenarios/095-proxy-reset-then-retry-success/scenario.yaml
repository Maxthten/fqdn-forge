id: 095-proxy-reset-then-retry-success
name: Proxy reset then retry success
description: Local retry composition that preserves source quota accounting.
version: "1.4.1"
root_domain: s095.v14.test
seed: 95
runner: { max_retries: 2, retry_after_cap_ms: 1000 }
network_profile: { mode: http_proxy, proxy_must_be_used: true, allow_retry: true }
include_root: false
allow_duplicates: false
allow_concurrent: true
coverage_tags: { source_shape: [generic], payload_format: [json], pagination: [none], authentication: [proxy_auth], network_profile: [http_proxy], quota_scope: [per_source], transport: [identity], fault_class: [disconnect], execution_style: [single], assertion_focus: [finding, audit, isolation] }
composition: { fault_stages: [proxy_connection, retry_recovery], event_order: [{ before: proxy_reset, after: retry_success }] }
fault_script:
  - { id: proxy-reset, stage: proxy, endpoint: source, proxy_fault: reset_before_response }
  - { id: proxy-forward, stage: proxy, endpoint: source }
  - { id: source-success, stage: source, endpoint: source, response_index: 0 }
endpoints:
  - id: source
    source_kind: generic_json
    match: { method: GET, path: /v14/095, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id }
    quota: [{ scope: per_source, success_limit: 1, exhausted_status: 429, retry_after_mode: seconds, retry_after_ms: 1000 }]
    replies: [{ status: 200, body: { items: [{ id: s095, host: api.s095.v14.test }] } }]
