id: 004-basic-code-search
name: code search
description: Extract domain-like tokens from snippets.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [code]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 20260814
include_root: false
endpoints:
  - id: code-search
    source_kind: code_search
    match: { method: GET, path: /code/v1/search, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { items_field: matches, candidate_field: snippet, kind: tokens }
    replies: [{ status: 200, body_file: fixtures/data.json }]
