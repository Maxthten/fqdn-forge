id: 069-external-submission-out-of-scope
name: External submission scope baseline
description: Baseline data for out-of-scope and similar-domain submission rejection.
version: "1.2.1"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [search]
  transport: [identity]
root_domain: target-$SEED.acme.test
seed: 69
include_root: false
allow_duplicates: false
allow_concurrent: true
endpoints:
  - id: search-source
    source_kind: internet_search
    source_label: search-source
    match: { method: GET, path: /v121/search, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id, timestamp_field: observed_at, tags_field: tags, confidence_field: confidence }
    replies: [{ status: 200, body_file: fixtures/data.json }]
