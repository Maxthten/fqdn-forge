id: 076-content-length-anomaly
name: Content-Length anomaly
description: An inconsistent Content-Length must fail parsing safely and not contaminate another run.
version: "1.2.1"
root_domain: target-$SEED.acme.test
seed: 76
include_root: false
allow_duplicates: false
allow_concurrent: true
endpoints:
  - id: search-source
    source_kind: internet_search
    source_label: search-source
    match: { method: GET, path: /v121/length, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 200, malformed_content_length: 1, body_file: fixtures/data.json }]
