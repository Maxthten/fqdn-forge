id: 066-proxy-egress-and-cross-run-denied
name: Proxy egress denied
description: The proxy denies the request locally and never forwards it to a source endpoint.
version: "1.3.0"
root_domain: target-66.acme.test
seed: 66
include_root: false
allow_duplicates: false
allow_concurrent: true
network_profile: { mode: http_proxy, proxy_must_be_used: true, max_connections: 2, virtual_timeout_ms: 250, fault: egress_denied }
endpoints:
  - id: denied-source
    source_kind: generic_json
    match: { method: GET, path: /v13/denied, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/data.json }]
