id: 092-rate-limit-retry-deflate-success
name: Rate-limit retry deflate success
description: A real 429 response is followed by a virtual wait and an actually deflate-encoded response.
version: "1.4.1"
root_domain: s092.v14.test
seed: 92
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_retries: 2, retry_after_cap_ms: 2000 }
network_profile: { mode: direct }
coverage_tags: { source_shape: [generic], payload_format: [json], pagination: [none], authentication: [none], network_profile: [direct], quota_scope: [per_key], transport: [deflate], fault_class: [rate_limit], execution_style: [single], assertion_focus: [finding, audit, determinism] }
composition: { fault_stages: [source_request, response_transport, retry_recovery], event_order: [{ before: rate_limited, after: deflate_success }] }
fault_script:
  - { id: initial-rate-limit, stage: source, endpoint: source, response_index: 0 }
  - { id: retry-deflate-success, stage: source, endpoint: source, response_index: 1, minimum_virtual_wait_ms: 2000 }
endpoints:
  - id: source
    source_kind: generic_json
    allow_retry: true
    quota: [{ scope: per_key, success_limit: 4, exhausted_status: 429, retry_after_mode: seconds, retry_after_ms: 2000 }]
    match: { method: GET, path: /v14/092, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id }
    replies:
      - { status: 429, retry_after: "2", body: { error: synthetic_rate_limit } }
      - { status: 200, encoding: deflate, body: { items: [{ id: s092, host: api.s092.v14.test }] } }
