id: 022-internet-search-partial
name: Internet Search partial fields
description: Empty and incomplete records do not create candidates.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [search]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 22
endpoints:
  - id: internet-partial
    source_kind: internet_search
    match: { method: GET, path: /v12/internet/partial, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: results, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/data.json }]
