id: 056-multi-source-large
name: Multi-source large data
description: Multiple local sources retain independent status and request audits.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [certificate]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 56
endpoints:
  - id: large-a
    source_kind: certificate
    match: { method: GET, path: /v12/large/a, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 200, generator: { kind: domain_records, count: 1000, unique: 1000 } }]
  - id: large-b
    source_kind: passive_dns
    match: { method: GET, path: /v12/large/b, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 200, generator: { kind: domain_records, count: 1000, unique: 1000 } }]
