id: 051-multilevel-scope
name: Multi-level target-domain scope
description: Scope checking uses label boundaries for a delegated target domain.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [generic]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: sub.acme.test
seed: 51
endpoints:
  - id: multilevel-scope
    source_kind: generic_json
    match: { method: GET, path: /v12/scope/multilevel, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/data.json }]
