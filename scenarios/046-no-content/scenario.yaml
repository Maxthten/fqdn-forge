id: 046-no-content
name: 204 no-content success
description: A 204 response succeeds without attempting JSON parsing.
version: "1.2"
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 46
endpoints:
  - id: no-content
    source_kind: generic_json
    match: { method: GET, path: /v12/no-content, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 204 }]
