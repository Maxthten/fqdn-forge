id: 024-threat-intel-noise
name: Threat Intel malformed association noise
description: Wrong field types are ignored and out-of-scope associations are filtered.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [intel]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 24
endpoints:
  - id: threat-noise
    source_kind: threat_intel
    match: { method: GET, path: /v12/threat/noise, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: records, candidate_field: domain }
    replies: [{ status: 200, body_file: fixtures/data.json }]
