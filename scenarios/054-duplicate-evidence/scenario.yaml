id: 054-duplicate-evidence
name: Large duplicate evidence merge
description: Many duplicate observations preserve provenance while the FQDN set stays bounded.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [generic]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 54
endpoints:
  - id: duplicate-evidence
    source_kind: generic_json
    match: { method: GET, path: /v12/duplicates, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host, record_id_field: id }
    replies:
      - status: 200
        duplicate_page: true
        generator: { kind: domain_records, count: 500, unique: 1 }
