id: 088-quota-recovery-http-date
name: Quota recovery with HTTP date
description: The server records a quota 429 with HTTP-date Retry-After then permits a virtual-time recovery.
version: "1.3.0"
root_domain: target-88.acme.test
seed: 88
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_retries: 3, retry_after_cap_ms: 5000 }
endpoints:
  - id: recovery-source
    source_kind: generic_json
    allow_retry: true
    quota: [{ scope: per_source, success_limit: 1, exhausted_status: 429, retry_after_mode: http_date, retry_after_ms: 1000, recover_after_virtual_ms: 1000 }]
    match: { method: GET, path: /v13/quota-recovery, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id }
    replies:
      - { status: 429, virtual_wait_ms: 1000, retry_after: "Sat, 15 Aug 2026 00:00:01 GMT", body_file: fixtures/error.json }
      - { status: 200, body_file: fixtures/data.json }
