id: 057-slow-fast-sources
name: Slow and fast source mix
description: A delayed local reply does not alter the other source contract.
version: "1.2"
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 57
endpoints:
  - id: slow-source
    source_kind: archive
    match: { method: GET, path: /v12/slow, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 200, delay_ms: 20, virtual_wait_ms: 5, body_file: fixtures/slow.json }]
  - id: fast-source
    source_kind: certificate
    match: { method: GET, path: /v12/fast, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/fast.json }]
