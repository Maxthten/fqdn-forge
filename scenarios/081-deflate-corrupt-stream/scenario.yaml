id: 081-deflate-corrupt-stream
name: Corrupt deflate stream
description: A corrupted local deflate stream fails safely without producing findings.
version: "1.3.0"
root_domain: target-81.acme.test
seed: 81
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_wire_response_bytes: 65536, max_decoded_response_bytes: 65536, max_expansion_ratio: 32, max_decompression_time_ms: 1000, max_chunk_bytes: 65536, max_chunk_count: 8 }
endpoints:
  - id: corrupt-source
    source_kind: generic_json
    match: { method: GET, path: /v13/deflate-corrupt, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 200, encoding: deflate, encoding_corrupt: true, body_file: fixtures/data.json }]
