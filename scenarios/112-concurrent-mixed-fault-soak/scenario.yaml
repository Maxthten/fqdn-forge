coverage_tags: { source_shape: [generic], payload_format: [json], pagination: [none], authentication: [proxy_auth], network_profile: [http_proxy], quota_scope: [per_source], transport: [chunked], fault_class: [lifecycle], execution_style: [soak], assertion_focus: [audit, isolation, resource, determinism] }
