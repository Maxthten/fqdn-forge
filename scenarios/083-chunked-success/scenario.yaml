id: 083-chunked-success
name: Chunked response success
description: A multi-chunk local response is consumed and parsed completely.
version: "1.3.0"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [generic]
  transport: [chunked]
root_domain: target-83.acme.test
seed: 83
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_wire_response_bytes: 65536, max_decoded_response_bytes: 65536, max_expansion_ratio: 32, max_decompression_time_ms: 1000, max_chunk_bytes: 65536, max_chunk_count: 8 }
endpoints:
  - id: chunk-source
    source_kind: generic_json
    match: { method: GET, path: /v13/chunked, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id }
    replies: [{ status: 200, transfer_mode: chunked, chunk_count: 3, body_file: fixtures/data.json }]
