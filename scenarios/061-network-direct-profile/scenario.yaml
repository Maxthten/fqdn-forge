id: 061-network-direct-profile
name: Direct local network profile
description: Direct profile exposes no proxy and permits one local source request.
version: "1.3.0"
root_domain: target-61.acme.test
seed: 61
include_root: false
allow_duplicates: false
allow_concurrent: true
network_profile: { mode: direct }
endpoints:
  - id: direct-source
    source_kind: generic_json
    match: { method: GET, path: /v13/direct, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id }
    replies: [{ status: 200, body_file: fixtures/data.json }]
