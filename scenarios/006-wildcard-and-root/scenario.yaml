id: 006-wildcard-and-root
name: wildcard and root
description: Filter wildcard and excluded root values.
root_domain: acme.test
seed: 20260814
include_root: false
endpoints:
  - id: certificate-search
    source_kind: certificate
    match: { method: GET, path: /ct/v1/search, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { items_field: records, candidate_field: name }
    replies: [{ status: 200, body_file: fixtures/data.json }]
