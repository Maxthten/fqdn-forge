id: 063-proxy-auth-and-redaction
name: Proxy authentication redaction
description: Valid synthetic proxy credentials pass without being copied into audit or reports.
version: "1.3.0"
coverage_tags:
  assertion_focus: [finding]
  authentication: [proxy_auth]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [http_proxy]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [generic]
  transport: [identity]
root_domain: target-63.acme.test
seed: 63
include_root: false
allow_duplicates: false
allow_concurrent: true
network_profile: { mode: http_proxy, proxy_must_be_used: true, max_connections: 4, virtual_timeout_ms: 250 }
endpoints:
  - id: auth-source
    source_kind: generic_json
    match: { method: GET, path: /v13/auth, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id }
    replies: [{ status: 200, body_file: fixtures/data.json }]
