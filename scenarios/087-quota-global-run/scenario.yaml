id: 087-quota-global-run
name: Global run quota
description: A single run budget is shared by independent local sources.
version: "1.3.0"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [rate_limit]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [global_run]
  source_shape: [generic]
  transport: [identity]
root_domain: target-87.acme.test
seed: 87
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_retries: 3, retry_after_cap_ms: 5000 }
endpoints:
  - id: first-budget
    source_kind: generic_json
    allow_retry: true
    quota: [{ scope: global_run, success_limit: 1, exhausted_status: 429, retry_after_mode: seconds, retry_after_ms: 1000 }]
    match: { method: GET, path: /v13/quota-global-a, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 429, virtual_wait_ms: 1000, retry_after: "1", body_file: fixtures/data.json }]
  - id: second-budget
    source_kind: generic_json
    allow_retry: true
    quota: [{ scope: global_run, success_limit: 1, exhausted_status: 429, retry_after_mode: seconds, retry_after_ms: 1000 }]
    match: { method: GET, path: /v13/quota-global-b, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/data.json }]
