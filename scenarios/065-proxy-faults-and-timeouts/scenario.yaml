id: 065-proxy-faults-and-timeouts
name: Proxy refusal fault
description: The local proxy refuses before any source request can be forwarded.
version: "1.3.0"
coverage_tags:
  assertion_focus: [finding]
  authentication: [proxy_auth]
  execution_style: [concurrent]
  fault_class: [disconnect]
  network_profile: [http_proxy]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [generic]
  transport: [identity]
root_domain: target-65.acme.test
seed: 65
include_root: false
allow_duplicates: false
allow_concurrent: true
network_profile: { mode: http_proxy, proxy_must_be_used: true, max_connections: 2, virtual_timeout_ms: 250, fault: connection_refused }
endpoints:
  - id: fault-source
    source_kind: generic_json
    match: { method: GET, path: /v13/fault, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/data.json }]
