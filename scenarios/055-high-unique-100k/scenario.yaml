id: 055-high-unique-100k
name: 100000 high unique records
description: Bounded local generation validates high-cardinality FQDN processing.
version: "1.2"
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 55
runner: { max_response_bytes: 16777216, timeout_ms: 10000 }
endpoints:
  - id: high-unique
    source_kind: generic_json
    match: { method: GET, path: /v12/high-unique, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies:
      - status: 200
        generator: { kind: domain_records, count: 100000, unique: 100000 }
