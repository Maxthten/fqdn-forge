id: 005-multi-source-overlap
name: multi source overlap
description: Deduplicate result names while retaining observations.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [certificate]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 20260814
include_root: false
endpoints:
  - id: certificate-search
    source_kind: certificate
    match: { method: GET, path: /ct/v1/search, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { items_field: records, candidate_field: name, timestamp_field: observed_at }
    replies: [{ status: 200, body_file: fixtures/certificate.json }]
  - id: passive-dns
    source_kind: passive_dns
    match: { method: GET, path: /dns/v1/history, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { items_field: records, candidate_field: name, timestamp_field: last_seen }
    replies: [{ status: 200, body_file: fixtures/dns.json }]
