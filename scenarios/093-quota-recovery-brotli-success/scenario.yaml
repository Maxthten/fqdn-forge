id: 093-quota-recovery-brotli-success
name: Quota recovery brotli success
description: A real HTTP-date Retry-After is parsed before the retry receives actual brotli bytes.
version: "1.4.1"
root_domain: s093.v14.test
seed: 93
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_retries: 2, retry_after_cap_ms: 2000 }
network_profile: { mode: direct }
coverage_tags: { source_shape: [generic], payload_format: [json], pagination: [none], authentication: [none], network_profile: [direct], quota_scope: [per_source], transport: [brotli], fault_class: [rate_limit], execution_style: [single], assertion_focus: [finding, audit, determinism] }
composition: { fault_stages: [source_request, response_transport, retry_recovery], event_order: [{ before: http_date_rate_limit, after: brotli_success }] }
fault_script:
  - { id: http-date-rate-limit, stage: source, endpoint: source, response_index: 0 }
  - { id: retry-brotli-success, stage: source, endpoint: source, response_index: 1, minimum_virtual_wait_ms: 2000 }
endpoints:
  - id: source
    source_kind: generic_json
    allow_retry: true
    quota: [{ scope: per_source, success_limit: 4, exhausted_status: 429, retry_after_mode: http_date, retry_after_ms: 2000 }]
    match: { method: GET, path: /v14/093, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host, record_id_field: id }
    replies:
      - { status: 429, retry_after: "Mon, 17 Aug 2026 00:00:02 GMT", body: { error: synthetic_rate_limit } }
