id: 048-html-error-json
name: HTML error page disguised as JSON
description: Configured HTML extraction does not trust an erroneous JSON content type.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [html]
  quota_scope: [none]
  source_shape: [generic]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 48
endpoints:
  - id: html-disguised
    source_kind: generic_html
    match: { method: GET, path: /v12/html-disguised, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: html, items_field: $, candidate_field: host, kind: tokens }
    replies: [{ status: 200, content_type: application/json, body_file: fixtures/error.html }]
