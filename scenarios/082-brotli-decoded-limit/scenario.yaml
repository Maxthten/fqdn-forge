id: 082-brotli-decoded-limit
name: Brotli decoded limit
description: A local Brotli response exceeds the declared decoded byte ceiling.
version: "1.3.0"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [generic]
  transport: [brotli]
root_domain: target-82.acme.test
seed: 82
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_wire_response_bytes: 65536, max_decoded_response_bytes: 20, max_expansion_ratio: 32, max_decompression_time_ms: 1000, max_chunk_bytes: 65536, max_chunk_count: 8 }
endpoints:
  - id: limit-source
    source_kind: generic_json
    match: { method: GET, path: /v13/brotli-limit, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 200, encoding: br, body_file: fixtures/data.json }]
