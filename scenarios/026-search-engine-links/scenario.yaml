id: 026-search-engine-links
name: Search Engine tracking and external links
description: Local search text keeps in-scope names and filters external-link noise.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [html]
  quota_scope: [none]
  source_shape: [search]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 26
endpoints:
  - id: search-links
    source_kind: search_engine
    match: { method: GET, path: /v12/search/links, query: { q: { equals: $ROOT_DOMAIN } } }
    extract: { format: html, items_field: $, candidate_field: host, kind: tokens }
    replies: [{ status: 200, content_type: text/html, body_file: fixtures/data.html }]
