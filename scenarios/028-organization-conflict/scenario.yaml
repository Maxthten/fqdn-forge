id: 028-organization-conflict
name: Organization weak association conflict
description: Multiple organization evidence sources preserve provenance and filter weak noise.
version: "1.2"
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 28
endpoints:
  - id: org-primary
    source_kind: organization
    match: { method: GET, path: /v12/org/primary, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host, record_id_field: id }
    replies: [{ status: 200, body_file: fixtures/primary.json }]
  - id: org-secondary
    source_kind: organization
    match: { method: GET, path: /v12/org/secondary, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host, record_id_field: id }
    replies: [{ status: 200, body_file: fixtures/secondary.json }]
