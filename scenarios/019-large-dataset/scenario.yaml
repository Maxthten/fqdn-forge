id: 019-large-dataset
name: large dataset
description: Deterministically generate 10,000 records, with an opt-in 100,000 record stress profile.
root_domain: acme.test
seed: 20260814
include_root: false
runner: { timeout_ms: 5000, max_response_bytes: 16777216 }
endpoints:
  - id: generic-search
    source_kind: generic_json
    match: { method: GET, path: /generic/v1/bulk, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { items_field: items, candidate_field: host }
    replies:
      - status: 200
        generator: { kind: domain_records, count: 10000, stress_count: 100000, field: host, unique: 5 }
