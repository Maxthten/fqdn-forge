id: 030-user-import-invalid
name: User Import duplicate and invalid CSV
description: Invalid rows and duplicate import evidence are deterministically handled.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [csv]
  quota_scope: [none]
  source_shape: [import]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 30
endpoints:
  - id: user-invalid
    source_kind: user_import
    match: { method: GET, path: /v12/import/invalid, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: csv, items_field: $, candidate_field: host, record_id_field: id }
    replies: [{ status: 200, content_type: text/csv, body_file: fixtures/data.csv }]
