id: 049-unicode-punycode
name: Unicode and Punycode
description: Unicode FQDN input is normalized to stable ASCII punycode.
version: "1.2"
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 49
endpoints:
  - id: unicode-source
    source_kind: generic_json
    match: { method: GET, path: /v12/unicode, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/data.json }]
