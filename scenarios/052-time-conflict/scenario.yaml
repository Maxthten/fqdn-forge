id: 052-time-conflict
name: Multi-source time conflict
description: Distinct observation times are retained as provenance rather than overwritten.
version: "1.2"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [none]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [none]
  source_shape: [pdns]
  transport: [identity]
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 52
endpoints:
  - id: time-old
    source_kind: passive_dns
    match: { method: GET, path: /v12/time/old, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host, record_id_field: id, timestamp_field: observed }
    replies: [{ status: 200, body_file: fixtures/old.json }]
  - id: time-new
    source_kind: threat_intel
    match: { method: GET, path: /v12/time/new, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host, record_id_field: id, timestamp_field: observed }
    replies: [{ status: 200, body_file: fixtures/new.json }]
