id: 032-generic-json-types
name: Generic JSON mixed field types
description: Mixed scalar types do not panic or create fabricated domains.
version: "1.2"
allow_duplicates: false
allow_concurrent: true
root_domain: acme.test
seed: 32
endpoints:
  - id: generic-types
    source_kind: generic_json
    match: { method: GET, path: /v12/generic/types, query: { domain: { equals: $ROOT_DOMAIN } } }
    extract: { format: json, items_field: items, candidate_field: host }
    replies: [{ status: 200, body_file: fixtures/data.json }]
