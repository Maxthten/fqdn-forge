id: 085-quota-per-source
name: Per-source quota exhaustion
description: A source-local quota returns deterministic 429 responses after its first consumed request.
version: "1.3.0"
coverage_tags:
  assertion_focus: [finding]
  authentication: [none]
  execution_style: [concurrent]
  fault_class: [rate_limit]
  network_profile: [direct]
  pagination: [none]
  payload_format: [json]
  quota_scope: [per_source]
  source_shape: [generic]
  transport: [identity]
root_domain: target-85.acme.test
seed: 85
include_root: false
allow_duplicates: false
allow_concurrent: true
runner: { max_retries: 3, retry_after_cap_ms: 5000 }
endpoints:
  - id: source-budget
    source_kind: generic_json
    allow_retry: true
    quota: [{ scope: per_source, success_limit: 1, exhausted_status: 429, retry_after_mode: seconds, retry_after_ms: 1000 }]
    match: { method: GET, path: /v13/quota-source, query: { domain: { equals: $TARGET_DOMAIN } }, headers: { x-lab-run-id: { present: true } } }
    extract: { items_field: items, candidate_field: host }
    replies: [{ status: 429, virtual_wait_ms: 1000, retry_after: "1", body_file: fixtures/data.json }]
